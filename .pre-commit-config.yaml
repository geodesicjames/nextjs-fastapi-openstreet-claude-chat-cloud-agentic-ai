# Git hooks run on every commit. One-time setup:  pre-commit install
# Run against all files manually:                pre-commit run --all-files
repos:
  # Secret scanning: blocks commits containing API keys, tokens, etc.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm-lock.yaml is multi-document
      # Eval outputs (.claude/hillclimb/) are generated files, committed as written.
      - id: end-of-file-fixer
        exclude: ^\.claude/hillclimb/
      - id: trailing-whitespace
        exclude: ^\.claude/hillclimb/

  # Python lint + format. Picks up config from backend/pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Frontend formatting, using the Prettier version pinned in frontend/package.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend exec prettier --check .
        language: system
        files: ^frontend/
        pass_filenames: false
