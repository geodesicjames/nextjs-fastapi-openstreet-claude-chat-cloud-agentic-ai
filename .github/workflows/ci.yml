name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres + PostGIS for this job, same image as docker-compose.
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Reads the pnpm version from the "packageManager" field.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  images:
    name: Production images (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catch a broken Dockerfile here rather than at deploy time.
      - name: Build backend (prod stage)
        run: docker build --target prod -t places-backend:ci backend

      - name: Build frontend (prod stage)
        run: docker build --target prod -t places-frontend:ci frontend

      # frontend/proxy.ts: with ORIGIN_VERIFY_SECRET set, only requests that
      # carry it (i.e. came through CloudFront) are served.
      - name: Frontend refuses requests without the origin secret
        run: |
          docker run -d --name web -e ORIGIN_VERIFY_SECRET=ci-secret -p 3000:3000 places-frontend:ci
          timeout 60 bash -c 'until curl -s -o /dev/null localhost:3000; do sleep 1; done'
          without=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-origin-verify: nope' localhost:3000/)
          with=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-origin-verify: ci-secret' localhost:3000/)
          echo "without=$without wrong=$wrong with=$with"
          docker rm -f web
          [ "$without" = 403 ] && [ "$wrong" = 403 ] && [ "$with" = 200 ]

      - name: Validate docker-compose.prod.yml
        env:
          ENV_FILE: .env.example
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Format check
        run: terraform fmt -check -recursive infra

      # -backend=false: validation needs no AWS credentials or state.
      - name: Validate each stack
        run: |
          for dir in infra/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments need write access; the failed check is signal enough.
          GITLEAKS_ENABLE_COMMENTS: false
